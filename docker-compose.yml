# NomosOS yerel geliştirme altyapısı
#
# Varsayılan: sadece altyapı servisleri (postgres, redis, minio)
#   docker compose up -d
# Uygulamalar dahil tam yığın (Dockerfile'lar ile):
#   docker compose --profile full up -d --build
#
# Uygulamaları host üzerinde çalıştırmak için (önerilen geliştirme akışı):
#   pnpm install && pnpm db:migrate && pnpm db:seed && pnpm dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nomosos-postgres
    environment:
      POSTGRES_USER: nomosos
      POSTGRES_PASSWORD: nomosos
      POSTGRES_DB: nomosos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomosos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomosos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nomosos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nomosos
      MINIO_ROOT_PASSWORD: nomosos-gizli-123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nomosos-api
    environment:
      DATABASE_URL: postgresql://nomosos:nomosos@postgres:5432/nomosos
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: nomosos
      S3_SECRET_KEY: nomosos-gizli-123
      S3_BUCKET: nomosos-belgeler
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-gelistirme-icin-jwt-secret}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nomosos-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
