# =============================================================================
# NomosOS — ÜRETİM Docker profili
# =============================================================================
#
# Bu dosya yerel geliştirme dosyasından (docker-compose.yml) BAĞIMSIZDIR ve onu
# genişletmez. Geliştirme varsayılanlarının üretime sızmasını engellemek için
# bilinçli olarak ayrı tutulmuştur.
#
# KULLANIM
#   1) cp docker-compose.prod.env.example .env.prod.local   ve içini doldurun
#   2) chmod 600 .env.prod.local
#   3) docker compose -f docker-compose.prod.yml --env-file .env.prod.local build
#   4) ./scripts/prod-migrate.sh                (şema göçlerini uygular)
#   5) docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d
#
# -----------------------------------------------------------------------------
# !!!!! MASTER_ENCRYPTION_KEY HAKKINDA KRİTİK UYARI !!!!!
# -----------------------------------------------------------------------------
# MASTER_ENCRYPTION_KEY, kiracıların AI sağlayıcı API anahtarlarını veritabanında
# AES-256-GCM ile şifreler. Bu anahtar KAYBEDİLİRSE veya DEĞİŞTİRİLİRSE:
#   * Veritabanındaki şifreli sağlayıcı anahtarları GERİ ALINAMAZ — kurtarma
#     yolu YOKTUR, veritabanı yedeği bile işe yaramaz (yedek de şifrelidir).
#   * Her kiracı kendi LLM anahtarını PANELDEN YENİDEN girmek zorunda kalır.
#   * PLATFORM_2FA_ENCRYPTION_KEY tanımlı değilse panel TOTP kayıtları da bu
#     anahtardan türetilir; kayıp hâlinde tüm platform yöneticilerinin iki adımlı
#     doğrulaması sıfırlanmak zorundadır.
# Bu anahtarı veritabanı yedeğinden AYRI bir kasada (parola yöneticisi / KMS /
# mühürlü zarf) saklayın. Yedekle aynı diskte tutmak, ikisini birden kaybetmek
# demektir.
# -----------------------------------------------------------------------------
#
# SIR YÖNETİMİ İLKESİ
# Aşağıdaki tüm sırlar `${DEĞİŞKEN:?...}` biçimindedir: değişken tanımsız veya
# boşsa `docker compose` AÇILMADAN hata verir. Bilinçli bir karardır — bu dosyada
# HİÇBİR gizli değerin varsayılanı YOKTUR, dolayısıyla "unutuldu da geliştirme
# parolasıyla üretime çıktı" senaryosu mümkün değildir.
#
# -----------------------------------------------------------------------------
# TERS VEKİL (REVERSE PROXY) — TLS SONLANDIRMA DIŞARIDADIR
# -----------------------------------------------------------------------------
# Bu yığın TLS sonlandırmaz. Uygulama portları yalnız 127.0.0.1'e bağlanır;
# internete açılan tek şey önünüzdeki vekildir (Caddy / Traefik / nginx).
# Vekil aynı makinedeyse host ağından 127.0.0.1:3000/3001/3002'ye ulaşır.
#
# Örnek Caddyfile (Caddy sertifikayı otomatik alır ve yeniler):
#
#   ornek-buro.com {
#       encode zstd gzip
#       header {
#           Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#           X-Content-Type-Options "nosniff"
#           Referrer-Policy "strict-origin-when-cross-origin"
#           -Server
#       }
#       reverse_proxy 127.0.0.1:3000
#   }
#
#   api.ornek-buro.com {
#       # Belge yüklemesi büyük olabilir; gövde tavanını vekilde de açın.
#       request_body { max_size 60MB }
#       reverse_proxy 127.0.0.1:3001
#   }
#
#   # Yönetim paneli ASLA herkese açılmaz: IP kısıtı + tercihen VPN arkası.
#   panel.ornek-buro.com {
#       @izinli remote_ip 10.0.0.0/8 192.168.0.0/16 <ofis-sabit-ip>/32
#       handle @izinli {
#           reverse_proxy 127.0.0.1:3002
#       }
#       handle {
#           respond "Erişim yok" 403
#       }
#   }
#
# Vekil koyduğunuzda .env.prod.local içinde MUTLAKA:
#   TRUSTED_PROXY_HOPS=1   (yoksa denetim izindeki IP alanı sahtelenebilir)
#   API_FORCE_HSTS=true
# =============================================================================

name: nomosos-prod

# --- Tekrar eden sertleştirme bloğu (YAML çapası) --------------------------
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ==========================================================================
  # PostgreSQL 16 — kiracı verisi (KVKK kapsamında yüksek hassasiyetli)
  # ==========================================================================
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: nomosos-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER zorunlu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu - openssl rand -base64 36}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB zorunlu}
      # Yeni küme oluşturulurken parola karması scram-sha-256 olsun (md5 değil).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Sunucu Türkiye'de olsa da kayıt zaman damgaları UTC tutulur.
      TZ: UTC
    # ÜRETİMDE PORT YAYINLANMAZ. Veritabanına yalnız `internal` ağdaki servisler
    # erişir. Dışarıdan bakmak gerekirse SSH tüneli kullanın:
    #   ssh -L 5432:127.0.0.1:5432 sunucu   (+ geçici olarak aşağıyı açın)
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    # Postgres giriş betiği veri dizinini chown/setuid eder; ALL düşürüldükten
    # sonra SADECE bu yetenekler geri verilir (tam liste değil, gereken kadarı).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/postgresql:size=64m,uid=70,gid=70
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================================================
  # Redis 7 — kuyruk / önbellek
  # ==========================================================================
  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: nomosos-prod-redis
    # Parolasız Redis, aynı ağdaki her konteynerin oturum/kuyruk verisini
    # okuyabilmesi demektir. Üretimde parola ZORUNLUDUR.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD zorunlu - openssl rand -base64 36}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD zorunlu}
    volumes:
      - redis-data:/data
    networks:
      - internal
    # `user:` BİLİNÇLİ OLARAK VERİLMEDİ: redis giriş betiği /data'yı chown edip
    # ayrıcalığı kendisi redis kullanıcısına (uid 999) bırakır. Elle user: yazmak
    # bu adımı atlar ve boş birime yazamaz.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      # REDISCLI_AUTH sayesinde parola komut satırında (ps çıktısında) görünmez.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # ==========================================================================
  # MinIO — belge deposu (S3 uyumlu)
  # "Verileriniz Türkiye'de" savı bu birimin nerede durduğuna bağlıdır.
  # ==========================================================================
  minio:
    <<: *hardening
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nomosos-prod-minio
    # Konsol İÇ AĞDA dinler; aşağıda hiçbir portu yayınlanmaz.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER zorunlu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD zorunlu - openssl rand -base64 36}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - internal
    # !!! MinIO KONSOLU (9001) ÜRETİMDE DIŞA AÇILMAZ !!!
    # Müvekkil belgelerinin tamamı bu konsoldan indirilebilir. Gerektiğinde
    # SSH tüneli ile bakın:  ssh -L 9001:127.0.0.1:9001 sunucu
    # ve yalnız o an için aşağıdaki satırı açın:
    # ports:
    #   - "127.0.0.1:9001:9001"
    cap_drop:
      - ALL
    # NOT: MinIO kök dosya sistemine (/tmp, .minio.sys kilitleri) yazar ve
    # read_only ile sürüm başına farklı davranır. Bu yüzden read_only
    # VERİLMEMİŞTİR; koruma cap_drop + no-new-privileges + ağ yalıtımıyla
    # sağlanır. Denemek isterseniz: read_only: true + tmpfs /tmp ekleyip
    # `docker compose logs minio` ile izin hatası olmadığını doğrulayın.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ==========================================================================
  # API (NestJS) — kiracı /api/v1 + platform /api/admin/v1
  # ==========================================================================
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nomosos/api:${IMAGE_TAG:-latest}
    container_name: nomosos-prod-api
    environment:
      NODE_ENV: production

      # --- Altyapı bağlantıları (parolalar iç ağda kalır) ---
      DATABASE_URL: postgresql://${POSTGRES_USER:?zorunlu}:${POSTGRES_PASSWORD:?zorunlu}@postgres:5432/${POSTGRES_DB:?zorunlu}?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD:?zorunlu}@redis:6379

      # --- Belge deposu ---
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?zorunlu}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?zorunlu}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET zorunlu}
      S3_REGION: ${S3_REGION:-us-east-1}

      # --- API ---
      API_PORT: 3001
      # EN AZ 32 KARAKTER. Kısa anahtarla uygulama AÇILMAZ (bilinçli davranış).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu ve >=32 karakter - openssl rand -base64 48}

      # !!! KAYBI GERİ ALINAMAZ — dosya başındaki uyarıyı okuyun !!!
      # Kiracıların AI sağlayıcı anahtarlarını AES-256-GCM ile şifreler.
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY zorunlu - 32 bayt hex - KAYBEDILIRSE SIFRELI AI ANAHTARLARI GERI ALINAMAZ}

      # --- Platform yönetim paneli ---
      # NODE_ENV=production iken "true" değilse uygulama AÇILMAZ (main.ts).
      PLATFORM_REQUIRE_2FA: ${PLATFORM_REQUIRE_2FA:-true}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      PLATFORM_2FA_ENCRYPTION_KEY: ${PLATFORM_2FA_ENCRYPTION_KEY:-}

      # --- CORS: web arayüzünün dıştaki adresi ---
      # Varsayılan http://localhost:3000'dür; üretilmiş web başka kökenden
      # istek yapamayacağı için ZORUNLU alan (bkz. docs/uretim-dagitimi.md §8.2).
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN zorunlu - ornek https://ornek-buro.com}
      # API'nin kimlik sağlayıcıdan (SSO/OIDC) görülen genel adresi:
      # redirect_uri = $API_PUBLIC_URL/api/v1/auth/sso/callback. Tanımsızsa
      # üretimde kurumsal giriş yanlış geri dönüş adresiyle ÇALIŞMAZ.
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL zorunlu - ornek https://api.ornek-buro.com}
      # Prometheus /metrics ucu: token tanımsızsa üretimde uç 404 döner
      # (izleme fiilen kapalı). Kurulumla birlikte üretin: openssl rand -hex 24
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Faz 2 — bildirim kanalları (SMTP zorunlu değil ama şiddetle önerilir:
      # parola sıfırlama ve hatırlatma e-postaları buna bağlıdır).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PLATFORM_NOTIFY_EMAIL: ${PLATFORM_NOTIFY_EMAIL:-}
      SMS_PROVIDER_BASE_URL: ${SMS_PROVIDER_BASE_URL:-}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      SMS_SENDER_TITLE: ${SMS_SENDER_TITLE:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

      # --- Zaman aşımı ---
      # Uzun sözleşme analiz parçaları tek AI çağrısında 60 sn'yi aşabilir;
      # varsayılan 60 sn "sağlayıcı yanıt vermedi" (502) üretiyordu.
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}

      # --- Ters vekil ---
      # Vekil arkasındaysanız 1 yazın; 0 = X-Forwarded-For'a HİÇ bakma.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:?TRUSTED_PROXY_HOPS zorunlu - vekil arkasinda 1, degilse 0}
      API_FORCE_HSTS: ${API_FORCE_HSTS:-true}

      # --- AI / RAG ---
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_INTERNAL_HOSTS: ${AI_INTERNAL_HOSTS:-}
      # AI_TIMEOUT_MS yukarıda ("Zaman aşımı") TEK KEZ tanımlıdır — ikinci bir
      # tanım YAML'de öncekini ezer ve 180 sn'lik düzeltmeyi sessizce 60'a çeker.
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      AI_RATE_LIMIT_PER_DAY: ${AI_RATE_LIMIT_PER_DAY:-300}
      # Büro (kiracı) başına, UÇTAN BAĞIMSIZ tavan — denetim bulgusu Ö-10.
      AI_RATE_LIMIT_TENANT_PER_MINUTE: ${AI_RATE_LIMIT_TENANT_PER_MINUTE:-60}
      AI_RATE_LIMIT_TENANT_PER_DAY: ${AI_RATE_LIMIT_TENANT_PER_DAY:-2000}
      # Oran sınırı sayacının yeri — denetim bulgusu Ö-09. Üretimde varsayılan
      # "redis": Redis zaten bu dosyada tanımlı ve çok örnekli dağıtımda
      # süreç-içi sayaç bütün sınırları örnek sayısıyla çarpar.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}

      # --- Yükleme / ayrıştırma sınırları ---
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-300}
      API_JSON_BODY_LIMIT: ${API_JSON_BODY_LIMIT:-1mb}

      # --- Faturalama ---
      DEFAULT_VAT_RATE: ${DEFAULT_VAT_RATE:-20}
      INVOICE_NUMBER_PREFIX: ${INVOICE_NUMBER_PREFIX:-NOM}
      EINVOICE_PROVIDER: ${EINVOICE_PROVIDER:-noop}

      TZ: Europe/Istanbul
    ports:
      # Yalnız yerel arayüze bağlanır; internete açan ters vekildir.
      - "127.0.0.1:${API_BIND_PORT:-3001}:3001"
    networks:
      - internal   # postgres / redis / minio
      - edge       # ters vekil + dış LLM sağlayıcıları (bulut BYO-LLM)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # apps/api/Dockerfile kök kullanıcı ile çalışır; ayrıcalığı burada düşürüyoruz
    # (node imajındaki `node` kullanıcısı uid/gid 1000). /repo dosyaları root'a
    # ait ama okunabilir olduğundan sorun çıkmaz. İzin hatası görürseniz
    # Dockerfile'a `USER node` eklenene kadar bu satırı geçici olarak kaldırın.
    user: "1000:1000"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Belge ayrıştırma sırasında geçici dosya yazılabilir; 50 MB'lık yükleme
      # tavanı düşünülerek ölçülendirildi.
      - /tmp:size=512m,mode=1777
    healthcheck:
      # LIVENESS UCU — hiçbir iş kuralına tabi değildir (denetim bulgusu K-02).
      #
      # Eskiden `/api/v1/health` kullanılıyordu ve bakım tam kilidi açıldığında
      # o uç da 503 dönüyordu: konteyner `unhealthy` oluyor, `depends_on:
      # service_healthy` taşıyan `web` ve `admin` bir daha ayağa kalkmıyor,
      # kilidi kapatabilecek TEK arayüz (admin paneli) kayboluyordu. Kurtarma
      # yalnız doğrudan `psql` müdahalesiydi.
      #
      # `/api/v1/health/live` yalnızca "süreç ayakta mı" der; bakım kilidi,
      # abonelik durumu ve kimlik onu etkilemez.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/api/v1/health/live | grep -q '\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================================================
  # Web (Next.js) — pazarlama sitesi + büro paneli
  # ==========================================================================
  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # apps/web/Dockerfile ARG NEXT_PUBLIC_API_URL tanımlar ve ENV'e yazar;
        # Next NEXT_PUBLIC_* değişkenlerini DERLEME ANINDA tarayıcı paketine gömer.
        # Değer, tarayıcının API'ye ulaşabildiği DIŞ adres olmalıdır.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL zorunlu - ornek https://api.ornek-buro.com}
        # Demo giriş sayfası (/demo-giris, Demo1234! hesapları) ÜRETİM PAKETİNE
        # GÖMÜLMEZ. Derleme anı değişkenidir; çalışma anında verilmesi yetmez.
        NEXT_PUBLIC_DISABLE_DEMO: "1"
    image: nomosos/web:${IMAGE_TAG:-latest}
    container_name: nomosos-prod-web
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Sunucu tarafı çağrılar için; tarayıcı paketi için build arg gereklidir.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?zorunlu}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      # Next çalışma anında .next/cache altına yazar (ISR/görsel optimizasyonu).
      - /repo/apps/web/.next/cache:size=256m
      # apps/web/Dockerfile `USER node` ile çalışır (F2-Ö-40); HOME=/home/node.
      - /home/node:size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================================================
  # Admin (Next.js) — platform yönetim paneli, port 3002
  # Bu panelden TÜM kiracıların verisi görülebilir. Herkese açılmaz:
  # ters vekilde IP kısıtı / VPN zorunludur (yukarıdaki Caddyfile örneği).
  # ==========================================================================
  admin:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:?NEXT_PUBLIC_ADMIN_API_URL zorunlu - ornek https://api.ornek-buro.com}
    image: nomosos/admin:${IMAGE_TAG:-latest}
    container_name: nomosos-prod-admin
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:?zorunlu}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${ADMIN_BIND_PORT:-3002}:3002"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /repo/apps/admin/.next/cache:size=256m
      - /home/node:size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3002/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  # ==========================================================================
  # Portal (Next.js) — müvekkil portalı, port 3003
  # Test yığınındaki üçüncü arayüz. Ters vekilde ayrı alt alan adıyla
  # (ör. musteri.ornek-buro.com) yayınlanır. Kimlik + POA canlılık +
  # hız limiti API tarafında uygulanır; vekilde de izleme tutulmalıdır.
  # ==========================================================================
  portal:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?zorunlu}
    image: nomosos/portal:${IMAGE_TAG:-latest}
    container_name: nomosos-prod-portal
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?zorunlu}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${PORTAL_BIND_PORT:-3003}:3003"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3003/giris || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

networks:
  # Veri katmanı: dışa çıkışı yoktur (internal: true). Postgres/Redis/MinIO
  # internete erişemez; sızma hâlinde veriyi dışarı taşımak zorlaşır.
  internal:
    name: nomosos-internal
    internal: true
  # Uygulama katmanı: ters vekil buraya bağlanır, API buradan bulut LLM
  # sağlayıcılarına çıkar. (Tam yerel LLM kullanan büroda bu ağ da
  # internal: true yapılabilir — "veri dışarı çıkmaz" savını donanımlaştırır.)
  edge:
    name: nomosos-edge

volumes:
  # Adlandırılmış birimler: konteyner silinse de veri kalır.
  # KVKK yedekleme yükümlülüğü için scripts/prod-backup.sh düzenli çalışmalıdır.
  postgres-data:
    name: nomosos-prod-postgres-data
  redis-data:
    name: nomosos-prod-redis-data
  minio-data:
    name: nomosos-prod-minio-data
