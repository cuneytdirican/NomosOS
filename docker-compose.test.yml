# NomosOS — TEST / DEMO YIĞINI
#
# Tek komutla her şeyi ayağa kaldırır, migration ve seed'i KENDİSİ çalıştırır:
#
#     docker compose -f docker-compose.test.yml up -d --build
#
# Giriş bilgileri ve denenecek davranışlar: docs/test-ortami.md
#
# ⛔ ÜRETİMDE KULLANMAYIN. Buradaki sırlar depoda açıkça yazılıdır ve
#    MinIO konsolu ile bütün portlar dışarı açıktır. Üretim için
#    docker-compose.prod.yml + docker-compose.prod.env.example kullanın:
#    orada hiçbir sırrın varsayılanı yoktur, operatör üretmek zorundadır.

x-test-secrets: &test-secrets
  # Test değerleri — bilinçli olarak sabit. JWT_SECRET 32 karakter kuralını
  # sağlar (kısa anahtarla API bilinçli olarak açılmaz).
  JWT_SECRET: "nomosos-test-ortami-icin-yeterince-uzun-jwt-anahtari-2026"
  PLATFORM_JWT_SECRET: "nomosos-test-ortami-icin-yeterince-uzun-platform-anahtari-2026"
  MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  PLATFORM_2FA_ENCRYPTION_KEY: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"

x-test-db: &test-db
  DATABASE_URL: "postgresql://nomosos:nomosos@postgres:5432/nomosos"

x-test-infra: &test-infra
  REDIS_URL: "redis://redis:6379"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "nomosos"
  S3_SECRET_KEY: "nomosos-gizli-123"
  S3_BUCKET: "nomosos-belgeler"
  S3_REGION: "us-east-1"

services:
  # ── GÜVENLİK (2026-09-03 olayı) ─────────────────────────────────────────────
  # Bu yığının portları eskiden 0.0.0.0'a yayınlanıyordu; internetten taranan
  # parolasız Redis bulunup REPLICAOF ile dış bir adrese replica yapıldı
  # (BullMQ "READONLY replica" hatalarıyla ortaya çıktı). Artık TÜM test
  # portları YALNIZ loopback'e bağlanır (127.0.0.1 + ::1): yerel geliştirme
  # etkilenmez, dış erişim kapalı. İKİ aile de bağlanır çünkü Windows'ta
  # tarayıcı `localhost`'u bazen ::1 (IPv6) olarak çözer; yalnız IPv4 bağı
  # o durumda "API sunucusuna ulaşılamadı" görünümü yaratıyordu (2026-09-04).
  # Üretim yığını (prod) zaten 127.0.0.1'e bağlıydı. Parolasız servis (redis)
  # ASLA dışa açılmaz.
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nomosos-test-postgres
    environment:
      POSTGRES_USER: nomosos
      POSTGRES_PASSWORD: nomosos
      POSTGRES_DB: nomosos
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomosos -d nomosos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nomosos-test-redis
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # NOT (2026-09-03): sabit RELEASE etiketi kayıt defterinden kalktığı için
    # çekilemedi; yerelde zaten çalışmakta olan imajla aynı olan :latest
    # kullanılır. Sürüm sabitlemesi üretim yığınında (prod) yapılır.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nomosos-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nomosos
      MINIO_ROOT_PASSWORD: nomosos-gizli-123
    ports:
      - "127.0.0.1:9000:9000"
      - "[::1]:9000:9000"
      # Konsol test ortamında AÇIK (üretimde kapalıdır) — belgeleri gözle
      # doğrulayabilmek için: http://localhost:9001
      - "127.0.0.1:9001:9001"
      - "[::1]:9001:9001"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Belge deposu kovasını oluşturur. Tek seferlik çalışır ve çıkar.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nomosos-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nomosos nomosos-gizli-123 &&
      mc mb --ignore-existing local/nomosos-belgeler &&
      echo 'Kova hazir: nomosos-belgeler'
      "

  # Migration + seed. API'den ÖNCE çalışır, bitince çıkar.
  # Seed idempotenttir: yığını yeniden başlatmak veriyi bozmaz.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nomosos/api:test
    container_name: nomosos-test-migrate
    working_dir: /repo
    environment:
      # Test yığını bilinçli DEMO ortamıdır: seed'in üretim kapısı (Faz 0,
      # packages/db/src/seed.ts) burada açıkça geçilir. Üretim compose'unda YOK.
      SEED_ALLOW_PROD: "true"
      <<: *test-db
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
      echo '--- migration uygulaniyor ---' &&
      pnpm --filter @nomosos/db exec prisma migrate deploy &&
      echo '--- seed calistiriliyor ---' &&
      pnpm --filter @nomosos/db seed &&
      echo '--- veritabani hazir ---'
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nomosos/api:test
    container_name: nomosos-test-api
    environment:
      <<: [*test-secrets, *test-db, *test-infra]
      API_PORT: "3001"
      # NODE_ENV bilinçli olarak "production" DEĞİL: bu yığın üretim değildir
      # ve öyle davranmamalıdır. API'de bir koruma var — üretim ortamında
      # PLATFORM_REQUIRE_2FA=false ile açılmayı REDDEDER ("panel tüm büroların
      # üstverisine bakar, tek faktörle korunamaz"). Bu koruma doğrudur ve
      # devre dışı bırakılmamıştır; ortamı gerçekte ne ise o olarak
      # etiketliyoruz. Üretimde NODE_ENV=production + 2FA zorunludur.
      NODE_ENV: "development"
      # Uzun sözleşme parçaları (~24 bin karakterlik iki taraflı analiz) tek
      # AI çağrısında 60 sn'yi aşabilir; varsayılan 60 sn sözleşme analizinde
      # "sağlayıcı yanıt vermedi" (502) üretiyordu. Üst sınır 600 sn (http.ts).
      AI_TIMEOUT_MS: "600000"
      # Platform sağlayıcısı LM Studio ise gömme modeli (OpenAI-uyumlu tipte varsayılan
      # text-embedding-3-small yerel sunucuda yoktur).
      AI_EMBEDDING_MODEL_OPENAI_COMPAT: "text-embedding-nomic-embed-text-v1.5"
      # Test panele TOTP uygulaması olmadan girilebilsin diye 2FA kapalı.
      PLATFORM_REQUIRE_2FA: "false"
      TRUSTED_PROXY_HOPS: "0"
      # E8 (rakip analizi) — portal ödeme bağlantısı test yığında SİMÜLASYON
      # modunda: gerçek para hareketi yok, ödeme kaydı düşer. Üretimde gerçek
      # sanal POS sözleşmesi bağlanana kadar tanımsız bırakılır (dürüst 503).
      ODEME_SAGLAYICI: "SIMULASYON"
      PLATFORM_LEGAL_NAME: "NomosOS Test Platformu"
      # Faz 2 — e-posta kanalı test yığınında Mailpit'e gider (http://localhost:8025).
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "NomosOS Test <bildirim@nomosos.test>"
      PLATFORM_NOTIFY_EMAIL: "satis@nomosos.test"
      AUTH_DEV_ECHO_RESET_TOKEN: "true"
    ports:
      - "127.0.0.1:3001:3001"
      - "[::1]:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* derleme anında gömülür; tarayıcıdan erişilebilen
        # adres olmalıdır (konteyner içi "api" adı tarayıcıdan çözülmez).
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    image: nomosos/web:test
    container_name: nomosos-test-web
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Faz 2 — SMTP yakalayıcı: gönderilen her e-posta arayüzde (8025) görünür, dışarı çıkmaz.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nomosos-test-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: "http://localhost:3001"
    image: nomosos/admin:test
    container_name: nomosos-test-admin
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: "http://localhost:3001"
    ports:
      - "127.0.0.1:3002:3002"
      - "[::1]:3002:3002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    image: nomosos/portal:test
    container_name: nomosos-test-portal
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "127.0.0.1:3003:3003"
      - "[::1]:3003:3003"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  test-postgres-data:
  test-minio-data:
